<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Family Camp 5</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FFFDF0] text-slate-900 min-h-screen py-8 px-4">
  <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-xl border border-[#F5E6A3] overflow-hidden">
    
    <!-- Header Banner: Butter Yellow Theme -->
    <div class="bg-[#FDF0A6] text-slate-900 p-6 text-center border-b border-[#F3DD75]">
      <span class="inline-block bg-[#F8E382] text-slate-900 text-xs px-3 py-1 rounded-full uppercase tracking-wider font-bold mb-2 border border-[#EAC850]">
        Formulir Resmi
      </span>
      <h1 class="text-2xl md:text-3xl font-black tracking-tight text-slate-950">FAMILY CAMP 5</h1>
      <p class="text-slate-800 text-sm mt-1 font-medium">Registrasi Peserta & Rincian Estimasi Biaya</p>
    </div>

    <!-- Form Section -->
    <form id="campForm" class="p-6 md:p-8 space-y-5">
      
      <!-- Data Identitas -->
      <div>
        <label class="block text-sm font-bold mb-1 text-slate-900">Nama Kepala Keluarga / Perwakilan</label>
        <input type="text" id="nama" required placeholder="Contoh: Budi Santoso"
               class="w-full border border-slate-300 rounded-lg p-2.5 text-slate-900 focus:ring-2 focus:ring-[#EAC850] focus:border-[#EAC850] outline-none transition">
      </div>

      <div>
        <label class="block text-sm font-bold mb-1 text-slate-900">Nomor WhatsApp Aktif</label>
        <input type="tel" id="whatsapp" placeholder="08xxxxxxxxxx" required
               class="w-full border border-slate-300 rounded-lg p-2.5 text-slate-900 focus:ring-2 focus:ring-[#EAC850] focus:border-[#EAC850] outline-none transition">
        <p class="text-xs text-slate-600 mt-1">Konfirmasi dan koordinasi lanjutan akan dikirim via nomor ini.</p>
      </div>

      <!-- Input Jumlah Peserta -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-bold mb-1 text-slate-900">Jumlah Dewasa</label>
          <input type="number" id="dewasa" min="1" value="1" required
                 class="w-full border border-slate-300 rounded-lg p-2.5 text-slate-900 focus:ring-2 focus:ring-[#EAC850] focus:border-[#EAC850] outline-none transition calc-trigger">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1 text-slate-900">Jumlah Anak</label>
          <input type="number" id="anak" min="0" value="0" required
                 class="w-full border border-slate-300 rounded-lg p-2.5 text-slate-900 focus:ring-2 focus:ring-[#EAC850] focus:border-[#EAC850] outline-none transition calc-trigger">
        </div>
      </div>

      <!-- Pilihan Transportasi -->
      <div>
        <label class="block text-sm font-bold mb-1 text-slate-900">Opsi Transportasi / Kendaraan</label>
        <select id="transportasi" class="w-full border border-slate-300 rounded-lg p-2.5 text-slate-900 focus:ring-2 focus:ring-[#EAC850] focus:border-[#EAC850] outline-none transition calc-trigger bg-white">
          <option value="Mobil">Mobil Pribadi (Rp 80.000 / mobil)</option>
          <option value="Motor">Sepeda Motor (Rp 55.000 / motor)</option>
          <option value="Tronton">Tronton Bersama (Rp 60.000 / orang)</option>
          <option value="Bawa Sendiri / Lainnya">Bawa Sendiri / Lainnya (Rp 0)</option>
        </select>
      </div>

      <!-- Catatan Khusus -->
      <div>
        <label class="block text-sm font-bold mb-1 text-slate-900">Catatan Khusus (Opsional)</label>
        <textarea id="catatan" rows="2" placeholder="Kebutuhan khusus, informasi tenda, dll."
                  class="w-full border border-slate-300 rounded-lg p-2.5 text-slate-900 focus:ring-2 focus:ring-[#EAC850] focus:border-[#EAC850] outline-none transition"></textarea>
      </div>

      <!-- Rincian Biaya (Breakdown) -->
      <div class="bg-[#FFFDF2] border border-[#F7E7A1] rounded-xl p-4 space-y-2 text-sm text-slate-900">
        <p class="font-bold text-slate-900 text-xs uppercase tracking-wider mb-2">Rincian Perhitungan Biaya</p>
        
        <div class="flex justify-between">
          <span class="text-slate-700">HTM + Ngabotram (<span id="lblTotalOrang">1</span> orang × Rp 35.000):</span>
          <span id="subtotalPerOrang" class="font-bold text-slate-950">Rp 35.000</span>
        </div>

        <div class="flex justify-between">
          <span class="text-slate-700">Biaya Acara & Doorprize (Wajib / keluarga):</span>
          <span class="font-bold text-slate-950">Rp 25.000</span>
        </div>

        <div class="flex justify-between">
          <span class="text-slate-700">Transportasi (<span id="lblTransport">Mobil</span>):</span>
          <span id="subtotalTransport" class="
